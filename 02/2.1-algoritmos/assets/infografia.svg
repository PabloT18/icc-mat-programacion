<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">2.1 · Representación y estructuras de algoritmos</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Problema, contrato y datos</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Un algoritmo describe pasos precisos para</text><text font-family="DejaVu Sans, sans-serif" x="60" y="364" font-size="25">obtener un resultado a partir de entradas.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">horas = 3</text><text xml:space="preserve" x="60" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">tarifa = 2</text><text xml:space="preserve" x="60" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">costo = horas * tarifa</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Pseudocódigo y diagramas de flujo</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">El pseudocódigo expresa el diseño con Leer,</text><text font-family="DejaVu Sans, sans-serif" x="750" y="364" font-size="25">Escribir, Si y Mientras sin depender de un</text><text font-family="DejaVu Sans, sans-serif" x="750" y="398" font-size="25">compilador.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">if horas &gt; 0:</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">    print(costo)</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Decisión y repetición</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Una decisión elige un camino y una</text><text font-family="DejaVu Sans, sans-serif" x="60" y="824" font-size="25">repetición ejecuta un bloque varias veces.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">total = 0</text><text xml:space="preserve" x="60" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">for numero in range(1, 4):</text><text xml:space="preserve" x="60" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">    total += numero</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Prueba de escritorio y límites</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">Una prueba de escritorio registra paso,</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">condición y valores después de cada</text><text font-family="DejaVu Sans, sans-serif" x="750" y="858" font-size="25">instrucción relevante.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">minutos = -1</text><text xml:space="preserve" x="750" y="939" font-family="DejaVu Sans, sans-serif" font-size="15.368852459016393">print(&quot;Duración inválida&quot; if minutos &lt; 0 else &quot;Duración válida&quot;)</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Especificar entradas, salidas y restricciones.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Dibujar la condición y el retorno de cada ciclo.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Validar con trazas normales y de frontera.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>