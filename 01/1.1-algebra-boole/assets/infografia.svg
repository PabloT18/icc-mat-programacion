<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">1.1 · Álgebra de Boole</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Proposiciones y valores de verdad</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Una proposición es un enunciado al que se</text><text font-family="DejaVu Sans, sans-serif" x="60" y="364" font-size="25">puede asignar verdadero o falso dentro de</text><text font-family="DejaVu Sans, sans-serif" x="60" y="398" font-size="25">un contexto definido.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">reserva = True</text><text xml:space="preserve" x="60" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">credencial = False</text><text xml:space="preserve" x="60" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">print(reserva)</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Negación, conjunción y disyunción</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">La negación invierte un valor.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">p, q = True, False</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">print(p and q, p or q, not p)</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Equivalencia y leyes de De Morgan</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Dos expresiones son equivalentes cuando</text><text font-family="DejaVu Sans, sans-serif" x="60" y="824" font-size="25">coinciden para todas las asignaciones de</text><text font-family="DejaVu Sans, sans-serif" x="60" y="858" font-size="25">sus variables.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">p, q = True, False</text><text xml:space="preserve" x="60" y="939" font-family="DejaVu Sans, sans-serif" font-size="22.35469448584203">print(not (p and q) == ((not p) or (not q)))</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Reglas, implicación y comprobación</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">La implicación p implica q solo es falsa</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">cuando p es verdadera y q falsa.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">p, q = True, False</text><text xml:space="preserve" x="750" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">print((not p) or q)</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Definir cada proposición antes de operar.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Distinguir OR inclusivo de OR exclusivo.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Probar equivalencia sobre todas las combinaciones.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>