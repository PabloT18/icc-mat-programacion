<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">3.09 · Matrices y recorridos anidados</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Forma, dimensiones y acceso</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Una matriz rectangular tiene el mismo</text><text font-family="DejaVu Sans, sans-serif" x="60" y="364" font-size="25">número de columnas en cada fila.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="19.672131147540984">matriz = [[0 for _ in range(3)] for _ in range(2)]</text><text xml:space="preserve" x="60" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">matriz[0][0] = 7</text><text xml:space="preserve" x="60" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">print(matriz)</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Recorrido y acumuladores por nivel</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">El ciclo externo selecciona una fila y el</text><text font-family="DejaVu Sans, sans-serif" x="750" y="364" font-size="25">interno recorre sus elementos.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">for fila in [[1, 2], [3, 4]]:</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">    total = 0</text><text xml:space="preserve" x="750" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">    for valor in fila:</text><text xml:space="preserve" x="750" y="527" font-family="DejaVu Sans, sans-serif" font-size="23">        total += valor</text><text xml:space="preserve" x="750" y="551" font-family="DejaVu Sans, sans-serif" font-size="23">    print(total)</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Transformación sin mutación</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Construir una matriz nueva exige un</text><text font-family="DejaVu Sans, sans-serif" x="60" y="824" font-size="25">contenedor externo nuevo y filas nuevas.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">resultado = []</text><text xml:space="preserve" x="60" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">for fila in [[1, 2], [3, 4]]:</text><text xml:space="preserve" x="60" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">    nueva = []</text><text xml:space="preserve" x="60" y="987" font-family="DejaVu Sans, sans-serif" font-size="23">    for valor in fila:</text><text xml:space="preserve" x="60" y="1011" font-family="DejaVu Sans, sans-serif" font-size="23">        nueva.append(valor * 2)</text><text xml:space="preserve" x="60" y="1035" font-family="DejaVu Sans, sans-serif" font-size="23">    resultado.append(nueva)</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Presentación y condiciones de fila</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">Una salida de matriz es un formato, no la</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">representación interna de una lista.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">print(&quot; | &quot;.join([&quot;BAJA&quot;, &quot;ALTA&quot;]))</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Validar forma antes de usar dimensiones.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Crear cada fila de salida por separado.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Separar transformación y presentación.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>