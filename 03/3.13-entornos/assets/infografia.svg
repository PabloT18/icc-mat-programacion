<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">3.13 · Entornos, ejecución y reproducibilidad</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Herramientas y versiones</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Separar editor, runtime y terminal.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">import sys</text><text xml:space="preserve" x="60" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">print(sys.version_info.major)</text><text xml:space="preserve" x="60" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">print(sys.executable)</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Aislamiento y dependencias</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">Aislar un entorno evita mezclar</text><text font-family="DejaVu Sans, sans-serif" x="750" y="364" font-size="25">dependencias de proyectos distintos.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">import pathlib</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">print(pathlib.Path.cwd())</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Scripts y cuadernos</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Un script ejecuta instrucciones desde el</text><text font-family="DejaVu Sans, sans-serif" x="60" y="824" font-size="25">inicio en un proceso nuevo.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">valor = 5</text><text xml:space="preserve" x="60" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">print(valor + 1)</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Diagnóstico y entrega limpia</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">Ante un fallo, comprobar primero comando,</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">carpeta, archivo y versión.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">print(&quot;Entorno listo&quot;)</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Identificar el runtime realmente ejecutado.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Reconstruir el entorno desde instrucciones.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Validar desde una copia limpia.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>