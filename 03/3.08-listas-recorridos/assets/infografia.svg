<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">3.08 · Recorridos, búsqueda y transformación</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Recorrido por valor y por posición</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Recorrer por valor basta para consultar</text><text font-family="DejaVu Sans, sans-serif" x="60" y="364" font-size="25">elementos.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">for indice, valor in enumerate([4, 7]):</text><text xml:space="preserve" x="60" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">    print(indice, valor)</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Búsqueda y terminación temprana</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">La búsqueda lineal compara elementos hasta</text><text font-family="DejaVu Sans, sans-serif" x="750" y="364" font-size="25">encontrar una coincidencia o agotar los</text><text font-family="DejaVu Sans, sans-serif" x="750" y="398" font-size="25">datos.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">posicion = -1</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">for i, valor in enumerate([4, 7, 4]):</text><text xml:space="preserve" x="750" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">    if valor == 7:</text><text xml:space="preserve" x="750" y="527" font-family="DejaVu Sans, sans-serif" font-size="23">        posicion = i</text><text xml:space="preserve" x="750" y="551" font-family="DejaVu Sans, sans-serif" font-size="23">        break</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Filtrar y transformar</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Filtrar conserva solo los elementos que</text><text font-family="DejaVu Sans, sans-serif" x="60" y="824" font-size="25">cumplen una condición.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">resultado = []</text><text xml:space="preserve" x="60" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">for valor in [2, -1, 3]:</text><text xml:space="preserve" x="60" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">    if valor &gt;= 0:</text><text xml:space="preserve" x="60" y="987" font-family="DejaVu Sans, sans-serif" font-size="23">        resultado.append(valor * 2)</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Reducir y comprobar invariantes</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">Reducir combina una secuencia en un</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">resumen: suma, máximo, cantidad o condición</text><text font-family="DejaVu Sans, sans-serif" x="750" y="858" font-size="25">global.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">total = 0</text><text xml:space="preserve" x="750" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">for valor in [2, 3, 4]:</text><text xml:space="preserve" x="750" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">    total += valor</text><text xml:space="preserve" x="750" y="987" font-family="DejaVu Sans, sans-serif" font-size="23">print(total)</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Elegir el patrón según el resultado requerido.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Conservar orden y duplicados cuando se exija.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Probar vacío, ausencia y coincidencias repetidas.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>