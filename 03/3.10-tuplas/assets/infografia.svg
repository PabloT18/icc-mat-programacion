<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">3.10 · Tuplas y registros de datos</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Registro y estructura</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Un registro reúne campos que describen una</text><text font-family="DejaVu Sans, sans-serif" x="60" y="364" font-size="25">entidad.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">producto = (&quot;P01&quot;, 8)</text><text xml:space="preserve" x="60" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">print(producto[0])</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Desempaquetado y acceso</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">Extraer campos debe respetar el esquema.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="21.857923497267763">for codigo, cantidad in [(&quot;A&quot;, 3), (&quot;B&quot;, 0)]:</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">    print(codigo, cantidad)</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Inmutabilidad superficial</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Un contenedor inmutable impide reemplazar</text><text font-family="DejaVu Sans, sans-serif" x="60" y="824" font-size="25">sus campos o posiciones, pero no</text><text font-family="DejaVu Sans, sans-serif" x="60" y="858" font-size="25">necesariamente impide modificar objetos</text><text font-family="DejaVu Sans, sans-serif" x="60" y="892" font-size="25">contenidos.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">original = (&quot;A&quot;, 3)</text><text xml:space="preserve" x="60" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">actualizado = (original[0], 4)</text><text xml:space="preserve" x="60" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">print(original, actualizado)</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Filtrar registros y validar dominio</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">Procesar registros combina lectura de</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">campos y condiciones.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">seleccionados = []</text><text xml:space="preserve" x="750" y="939" font-family="DejaVu Sans, sans-serif" font-size="21.857923497267763">for codigo, cantidad in [(&quot;A&quot;, 3), (&quot;B&quot;, 0)]:</text><text xml:space="preserve" x="750" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">    if cantidad &gt; 0:</text><text xml:space="preserve" x="750" y="987" font-family="DejaVu Sans, sans-serif" font-size="23">        seleccionados.append(codigo)</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Definir el esquema de cada registro.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Distinguir inmutabilidad superficial y profunda.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Usar record como contraste idiomático en Java.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>