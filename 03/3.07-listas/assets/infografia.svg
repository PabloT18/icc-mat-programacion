<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">3.07 · Vectores y listas</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Modelo de secuencia e índices</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Un vector organiza elementos mediante</text><text font-family="DejaVu Sans, sans-serif" x="60" y="364" font-size="25">posiciones.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">notas = [7, 9, 8]</text><text xml:space="preserve" x="60" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">print(notas[0], len(notas))</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Agregar, consultar y eliminar</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">Cada operación tiene efectos diferentes.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">datos = [2, 4]</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">datos.append(6)</text><text xml:space="preserve" x="750" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">datos[0] = 3</text><text xml:space="preserve" x="750" y="527" font-family="DejaVu Sans, sans-serif" font-size="23">print(datos.pop())</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Alias, copia y mutabilidad</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Asignar una colección a otra variable puede</text><text font-family="DejaVu Sans, sans-serif" x="60" y="824" font-size="25">compartir el mismo objeto.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">original = [2, 4]</text><text xml:space="preserve" x="60" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">copia = original.copy()</text><text xml:space="preserve" x="60" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">copia[0] = 9</text><text xml:space="preserve" x="60" y="987" font-family="DejaVu Sans, sans-serif" font-size="23">print(original, copia)</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Operaciones y casos vacíos</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">Una colección vacía es una entrada legítima</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">en muchos problemas.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">datos = [9, 2, 5]</text><text xml:space="preserve" x="750" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">print(sorted(datos))</text><text xml:space="preserve" x="750" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">print(datos)</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Distinguir índice y valor.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Diferenciar alias de copia.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Definir comportamiento para colección vacía.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>