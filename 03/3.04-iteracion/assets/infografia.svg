<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">3.04 · Repetición, contadores y acumuladores</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Repetición contada con for</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Usar una repetición contada cuando el</text><text font-family="DejaVu Sans, sans-serif" x="60" y="364" font-size="25">número de pasos se conoce o cuando se</text><text font-family="DejaVu Sans, sans-serif" x="60" y="398" font-size="25">recorre una secuencia finita.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">for numero in range(1, 6):</text><text xml:space="preserve" x="60" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">    print(numero)</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Repetición condicionada con while</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">Usar while cuando la continuidad depende</text><text font-family="DejaVu Sans, sans-serif" x="750" y="364" font-size="25">del estado.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">restantes = 3</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">while restantes &gt; 0:</text><text xml:space="preserve" x="750" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">    print(restantes)</text><text xml:space="preserve" x="750" y="527" font-family="DejaVu Sans, sans-serif" font-size="23">    restantes -= 1</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Contar, acumular y mantener</text><text font-family="DejaVu Sans, sans-serif" x="60" y="743" font-size="27" style="fill:#003772" font-weight="bold">invariantes</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Un contador aumenta por cada dato que</text><text font-family="DejaVu Sans, sans-serif" x="60" y="824" font-size="25">cumple una condición.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">total = 0</text><text xml:space="preserve" x="60" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">for numero in range(1, 5):</text><text xml:space="preserve" x="60" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">    total += numero</text><text xml:space="preserve" x="60" y="987" font-family="DejaVu Sans, sans-serif" font-size="23">print(total)</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Anidamiento, costo y pruebas</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">En ciclos anidados, cada iteración externa</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">inicia un recorrido interno.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">for fila in range(2):</text><text xml:space="preserve" x="750" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">    for columna in range(3):</text><text xml:space="preserve" x="750" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">        print(fila, columna)</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Inicializar estado antes del ciclo.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Excluir el centinela del procesamiento.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Justificar terminación y límites.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>