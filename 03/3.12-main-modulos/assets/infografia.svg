<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">3.12 · Punto de entrada y módulos</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Módulos y dependencias</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Un módulo agrupa definiciones relacionadas.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">from operaciones import sumar</text><text xml:space="preserve" x="60" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">print(sumar([2, 3]))</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Punto de entrada y ejecución al</text><text font-family="DejaVu Sans, sans-serif" x="750" y="283" font-size="27" style="fill:#003772" font-weight="bold">importar</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">Definir un punto de entrada identifica</text><text font-family="DejaVu Sans, sans-serif" x="750" y="364" font-size="25">dónde comienza una ejecución intencional.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">def main():</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">    print(&quot;Inicio&quot;)</text><text xml:space="preserve" x="750" y="503" font-family="DejaVu Sans, sans-serif" font-size="23"></text><text xml:space="preserve" x="750" y="527" font-family="DejaVu Sans, sans-serif" font-size="23">if __name__ == &quot;__main__&quot;:</text><text xml:space="preserve" x="750" y="551" font-family="DejaVu Sans, sans-serif" font-size="23">    main()</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Contratos entre archivos</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Una interfaz establece nombres, parámetros,</text><text font-family="DejaVu Sans, sans-serif" x="60" y="824" font-size="25">retornos y errores.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">def total(datos):</text><text xml:space="preserve" x="60" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">    return sum(datos)</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Pruebas de integración</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">Una prueba de integración comprueba cómo se</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">conectan funciones y archivos.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">import operaciones</text><text xml:space="preserve" x="750" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">assert operaciones.sumar([2, 3]) == 5</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Mantener utilidades sin interacción al importar.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Pasar datos mediante argumentos.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Probar archivos juntos desde una carpeta limpia.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>