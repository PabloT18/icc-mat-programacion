<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">3.06 · Cadenas y procesamiento de texto</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Secuencias e inmutabilidad</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Una cadena es una secuencia de elementos de</text><text font-family="DejaVu Sans, sans-serif" x="60" y="364" font-size="25">texto.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">texto = &quot;Cuenca&quot;</text><text xml:space="preserve" x="60" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">print(len(texto), texto[0], texto[-1])</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Recorte, búsqueda y normalización</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">Normalizar significa aplicar</text><text font-family="DejaVu Sans, sans-serif" x="750" y="364" font-size="25">transformaciones acordadas, no eliminar</text><text font-family="DejaVu Sans, sans-serif" x="750" y="398" font-size="25">arbitrariamente información.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">texto = &quot;  Aula A  &quot;</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">limpio = texto.strip().lower()</text><text xml:space="preserve" x="750" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">print(limpio, &quot;aula&quot; in limpio)</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Recorrido y conteo</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Procesar texto carácter por carácter</text><text font-family="DejaVu Sans, sans-serif" x="60" y="824" font-size="25">permite contar vocales, detectar símbolos o</text><text font-family="DejaVu Sans, sans-serif" x="60" y="858" font-size="25">construir una versión transformada.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">cantidad = 0</text><text xml:space="preserve" x="60" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">for letra in &quot;Aula&quot;.lower():</text><text xml:space="preserve" x="60" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">    if letra in &quot;aeiou&quot;:</text><text xml:space="preserve" x="60" y="987" font-family="DejaVu Sans, sans-serif" font-size="23">        cantidad += 1</text><text xml:space="preserve" x="60" y="1011" font-family="DejaVu Sans, sans-serif" font-size="23">print(cantidad)</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Separación, unión y contratos de</text><text font-family="DejaVu Sans, sans-serif" x="750" y="743" font-size="27" style="fill:#003772" font-weight="bold">formato</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">Dividir un texto en palabras y volver a</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">unirlo son operaciones distintas.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">print(&quot; | &quot;.join(&quot;rojo azul&quot;.split()))</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Acordar qué caracteres se aceptan.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Conservar el original cuando importe.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Separar transformación, validación y salida.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>