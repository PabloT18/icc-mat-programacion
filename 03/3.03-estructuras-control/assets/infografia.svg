<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">3.03 · Decisiones y operadores lógicos</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Selección simple y alternativa</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Una selección simple ejecuta un bloque solo</text><text font-family="DejaVu Sans, sans-serif" x="60" y="364" font-size="25">cuando se cumple una condición.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">edad = 18</text><text xml:space="preserve" x="60" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">if edad &gt;= 18:</text><text xml:space="preserve" x="60" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">    print(&quot;Mayor de edad&quot;)</text><text xml:space="preserve" x="60" y="527" font-family="DejaVu Sans, sans-serif" font-size="23">else:</text><text xml:space="preserve" x="60" y="551" font-family="DejaVu Sans, sans-serif" font-size="23">    print(&quot;Menor de edad&quot;)</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Cadena de condiciones y cobertura</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">Una clasificación mutuamente excluyente</text><text font-family="DejaVu Sans, sans-serif" x="750" y="364" font-size="25">requiere una cadena que detenga la búsqueda</text><text font-family="DejaVu Sans, sans-serif" x="750" y="398" font-size="25">al encontrar la primera condición</text><text font-family="DejaVu Sans, sans-serif" x="750" y="432" font-size="25">verdadera.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">nota = 8</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">if nota &gt;= 9:</text><text xml:space="preserve" x="750" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">    print(&quot;Excelente&quot;)</text><text xml:space="preserve" x="750" y="527" font-family="DejaVu Sans, sans-serif" font-size="23">elif nota &gt;= 7:</text><text xml:space="preserve" x="750" y="551" font-family="DejaVu Sans, sans-serif" font-size="23">    print(&quot;Aprobado&quot;)</text><text xml:space="preserve" x="750" y="575" font-family="DejaVu Sans, sans-serif" font-size="23">else:</text><text xml:space="preserve" x="750" y="599" font-family="DejaVu Sans, sans-serif" font-size="23">    print(&quot;Refuerzo&quot;)</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Condiciones compuestas y</text><text font-family="DejaVu Sans, sans-serif" x="60" y="743" font-size="27" style="fill:#003772" font-weight="bold">cortocircuito</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Combinar condiciones con conjunción,</text><text font-family="DejaVu Sans, sans-serif" x="60" y="824" font-size="25">disyunción y negación permite expresar</text><text font-family="DejaVu Sans, sans-serif" x="60" y="858" font-size="25">reglas de elegibilidad.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">divisor = 0</text><text xml:space="preserve" x="60" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">print(divisor != 0 and 10 / divisor &gt; 2)</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Validación y errores de conversión</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">La validación de dominio revisa valores ya</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">convertidos; la validación de formato</text><text font-family="DejaVu Sans, sans-serif" x="750" y="858" font-size="25">detecta texto que no se puede convertir.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">try:</text><text xml:space="preserve" x="750" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">    numero = int(&quot;abc&quot;)</text><text xml:space="preserve" x="750" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">except ValueError:</text><text xml:space="preserve" x="750" y="987" font-family="DejaVu Sans, sans-serif" font-size="23">    print(&quot;Ingresar un entero&quot;)</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Definir intervalos sin huecos.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Validar formato y dominio por separado.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Cubrir cada rama y sus fronteras.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>