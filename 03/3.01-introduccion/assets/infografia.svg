<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">3.01 · Fundamentos del lenguaje</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Programa, intérprete y compilación</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Un programa expresa un algoritmo con la</text><text font-family="DejaVu Sans, sans-serif" x="60" y="364" font-size="25">sintaxis de un lenguaje.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">print(&quot;Programación&quot;)</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Variables, asignación y tipos</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">Una variable permite asociar un nombre con</text><text font-family="DejaVu Sans, sans-serif" x="750" y="364" font-size="25">un valor y usarlo en expresiones</text><text font-family="DejaVu Sans, sans-serif" x="750" y="398" font-size="25">posteriores.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">cantidad = 4</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">precio = 1.75</text><text xml:space="preserve" x="750" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">producto = &quot;Cuaderno&quot;</text><text xml:space="preserve" x="750" y="527" font-family="DejaVu Sans, sans-serif" font-size="23">disponible = True</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Operadores y evaluación</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Los operadores combinan operandos para</text><text font-family="DejaVu Sans, sans-serif" x="60" y="824" font-size="25">construir expresiones.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">print(7 / 2, 7 // 2, 7 % 2, 2 ** 3)</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Estado, trazas y errores</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">El estado reúne los valores observables en</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">un instante de ejecución.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">cantidad = 2</text><text xml:space="preserve" x="750" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">cantidad = cantidad + 1</text><text xml:space="preserve" x="750" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">print(cantidad)</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Distinguir tipo, valor y nombre.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Evaluar expresiones respetando precedencia.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Verificar división y formato según el lenguaje.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>