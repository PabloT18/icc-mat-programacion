<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">3.05 · Funciones, contratos y descomposición</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Contrato, parámetros y argumentos</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Una función reúne una operación con un</text><text font-family="DejaVu Sans, sans-serif" x="60" y="364" font-size="25">nombre y un contrato.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">def doble(numero):</text><text xml:space="preserve" x="60" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">    return numero * 2</text><text xml:space="preserve" x="60" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">print(doble(7))</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Retornar y mostrar</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">Retornar entrega un valor al código que</text><text font-family="DejaVu Sans, sans-serif" x="750" y="364" font-size="25">llamó la función.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">def area(base, altura):</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">    return base * altura / 2</text><text xml:space="preserve" x="750" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">resultado = area(4, 3)</text><text xml:space="preserve" x="750" y="527" font-family="DejaVu Sans, sans-serif" font-size="23">print(resultado)</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Alcance, mutabilidad y efectos</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Una variable local pertenece a una llamada,</text><text font-family="DejaVu Sans, sans-serif" x="60" y="824" font-size="25">no al programa entero.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">def incrementar(n):</text><text xml:space="preserve" x="60" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">    n += 1</text><text xml:space="preserve" x="60" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">    return n</text><text xml:space="preserve" x="60" y="987" font-family="DejaVu Sans, sans-serif" font-size="23">valor = 4</text><text xml:space="preserve" x="60" y="1011" font-family="DejaVu Sans, sans-serif" font-size="23">print(incrementar(valor), valor)</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Pruebas de funciones y</text><text font-family="DejaVu Sans, sans-serif" x="750" y="743" font-size="27" style="fill:#003772" font-weight="bold">descomposición</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">Probar una función con argumentos concretos</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">reduce la dependencia del teclado.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">def mitad_par(n):</text><text xml:space="preserve" x="750" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">    if n % 2 != 0:</text><text xml:space="preserve" x="750" y="963" font-family="DejaVu Sans, sans-serif" font-size="18.558614290133004">        raise ValueError(&quot;Se requiere un entero par&quot;)</text><text xml:space="preserve" x="750" y="987" font-family="DejaVu Sans, sans-serif" font-size="23">    return n // 2</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Escribir contratos antes del cuerpo.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Retornar datos y separar presentación.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Probar cada función de manera aislada.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>