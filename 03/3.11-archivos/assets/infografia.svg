<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><rect width="1400" height="1700" fill="white"/><style>text{font-family:DejaVu Sans;fill:#403F3B}.h{font-weight:bold;fill:#003772}.code{font-size:23px}</style><rect x="30" y="25" width="1340" height="145" rx="16" fill="#003772"/><text font-family="DejaVu Sans, sans-serif" x="65" y="80" font-size="36" style="fill:#FFFFFF" font-weight="bold">3.11 · Archivos de texto y persistencia</text><text font-family="DejaVu Sans, sans-serif" x="65" y="147" font-size="23" style="fill:#FCC000">Programación · Python · UPS Cuenca</text><rect x="35" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="248" font-size="27" style="fill:#003772" font-weight="bold">Ruta, formato y codificación</text><text font-family="DejaVu Sans, sans-serif" x="60" y="330" font-size="25">Una ruta relativa se interpreta desde el</text><text font-family="DejaVu Sans, sans-serif" x="60" y="364" font-size="25">directorio de trabajo del proceso, que no</text><text font-family="DejaVu Sans, sans-serif" x="60" y="398" font-size="25">siempre coincide con la carpeta del código.</text><text xml:space="preserve" x="60" y="455" font-family="DejaVu Sans, sans-serif" font-size="23">from pathlib import Path</text><text xml:space="preserve" x="60" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">ruta = Path(&quot;mediciones.txt&quot;)</text><rect x="725" y="200" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="248" font-size="27" style="fill:#003772" font-weight="bold">Lectura y cierre de recursos</text><text font-family="DejaVu Sans, sans-serif" x="750" y="330" font-size="25">Abrir un archivo adquiere un recurso que</text><text font-family="DejaVu Sans, sans-serif" x="750" y="364" font-size="25">debe cerrarse aunque ocurra un error.</text><text xml:space="preserve" x="750" y="455" font-family="DejaVu Sans, sans-serif" font-size="17.256255392579813">with open(&quot;mediciones.txt&quot;, encoding=&quot;utf-8&quot;) as archivo:</text><text xml:space="preserve" x="750" y="479" font-family="DejaVu Sans, sans-serif" font-size="23">    for linea in archivo:</text><text xml:space="preserve" x="750" y="503" font-family="DejaVu Sans, sans-serif" font-size="23">        print(linea.rstrip(&quot;\n&quot;))</text><rect x="35" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="60" y="708" font-size="27" style="fill:#003772" font-weight="bold">Escritura, anexado y seguridad del</text><text font-family="DejaVu Sans, sans-serif" x="60" y="743" font-size="27" style="fill:#003772" font-weight="bold">resultado</text><text font-family="DejaVu Sans, sans-serif" x="60" y="790" font-size="25">Escribir puede reemplazar datos existentes.</text><text xml:space="preserve" x="60" y="915" font-family="DejaVu Sans, sans-serif" font-size="16.95873374788016">with open(&quot;salida.txt&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) as archivo:</text><text xml:space="preserve" x="60" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">    archivo.write(&quot;Total: 12\n&quot;)</text><rect x="725" y="660" width="660" height="435" rx="14" fill="#F3F3FA" stroke="#d8dfeb"/><text font-family="DejaVu Sans, sans-serif" x="750" y="708" font-size="27" style="fill:#003772" font-weight="bold">Validación de registros y errores</text><text font-family="DejaVu Sans, sans-serif" x="750" y="790" font-size="25">Separar errores del sistema de errores del</text><text font-family="DejaVu Sans, sans-serif" x="750" y="824" font-size="25">contenido.</text><text xml:space="preserve" x="750" y="915" font-family="DejaVu Sans, sans-serif" font-size="23">try:</text><text xml:space="preserve" x="750" y="939" font-family="DejaVu Sans, sans-serif" font-size="23">    valor = int(&quot;dato&quot;)</text><text xml:space="preserve" x="750" y="963" font-family="DejaVu Sans, sans-serif" font-size="23">except ValueError:</text><text xml:space="preserve" x="750" y="987" font-family="DejaVu Sans, sans-serif" font-size="23">    print(&quot;Línea inválida&quot;)</text><rect x="35" y="1140" width="1330" height="490" rx="14" fill="#fffdf0" stroke="#FCC000"/><text font-family="DejaVu Sans, sans-serif" x="65" y="1195" font-size="32" style="fill:#003772" font-weight="bold">Aplicar y comprobar</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1260" font-size="27">1. Fijar ruta, codificación y formato.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1330" font-size="27">2. Cerrar recursos incluso ante errores.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1400" font-size="27">3. Distinguir dato inválido de fallo de archivo.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1505" font-size="26">Recorrido de trabajo: definir contrato, ejecutar ejemplo, probar fronteras y resolver</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1542" font-size="26">la práctica.</text><text font-family="DejaVu Sans, sans-serif" x="65" y="1668" font-size="21" style="fill:#5C5B5F">Ing. Pablo Torres, Mgtr. · Síntesis técnica del material de clase</text></svg>