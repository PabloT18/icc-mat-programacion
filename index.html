<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >
    <title>Material de curso · Programación</title>
    <link
        rel="stylesheet"
        href="assets/css/styles.css"
    >
</head>

<body><a
        class="skip"
        href="#main"
    >Ir al contenido</a>
    <header class="topbar"><img
            class="brand"
            src="assets/logos/ups-computacion.png"
            alt="UPS · Carrera de Computación · Sede Cuenca"
        ><span class="course-label">Programación</span></header>
    <div class="shell">
        <aside class="sidebar">
            <h2>Unidades del curso</h2>
            <nav
                class="unit-nav"
                aria-label="Unidades"
            ><button
                    class="unit-button"
                    data-unit="1"
                ><span>Unidad 1</span><small>Lógica Matemática</small></button><button
                    class="unit-button"
                    data-unit="2"
                ><span>Unidad 2</span><small>Algoritmos</small></button><button
                    class="unit-button"
                    data-unit="3"
                ><span>Unidad 3</span><small>Lenguaje de Programación</small></button></nav>
            <div class="support"><label for="language">Versión del material</label><select id="language">
                    <option value="python">Python · principal</option>
                    <option value="java">Java · complemento</option>
                </select>
                <p>Prácticas independientes<br>PL exclusivamente en Python</p><a href="README.html">Guía del curso</a>
            </div>
        </aside>
        <main
            class="workspace"
            id="main"
        >
            <section id="listing">
                <p
                    class="eyebrow"
                    id="unitLabel"
                ></p>
                <h1 id="unitTitle"></h1>
                <p class="intro">Consultar el material, ejecutar la demostración y resolver la práctica de clase.</p>
                <div
                    class="tabs"
                    aria-label="Tipo de recurso"
                ><button
                        class="tab active"
                        data-tab="material"
                        aria-pressed="true"
                    >Material de clase</button><button
                        class="tab"
                        data-tab="labs"
                        aria-pressed="false"
                    >Prácticas de laboratorio</button></div>
                <div id="resources"></div>
                <p class="footer">Ing. Pablo Torres, Mgtr. · Universidad Politécnica Salesiana</p>
            </section>
            <section
                id="reader"
                class="hidden"
            >
                <div class="viewer-bar"><button
                        class="button"
                        id="back"
                    >Volver a la unidad</button>
                    <div
                        class="viewer-title"
                        id="readerTitle"
                    ></div>
                    <div class="viewer-links"><a
                            id="fullPage"
                            class="button"
                            target="_blank"
                            rel="noopener"
                        >Abrir página</a><a
                            id="deckLink"
                            class="button primary"
                            download
                        >PPTX</a></div>
                </div><iframe
                    class="viewer"
                    id="viewer"
                    title="Material de Programación"
                ></iframe>
            </section>
        </main>
    </div>
    <script src="assets/js/course-data.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
